<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="'MS Sans Serif', Tahoma, Arial, sans-serif">
  <defs>
    <linearGradient id="titolo" x1="0" x2="1">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#1084d0"/>
    </linearGradient>
    <clipPath id="macchina"><rect x="40" y="108" width="0" height="26">
      <animate attributeName="width" values="0;0;250;250;250;0" keyTimes="0;0.05;0.5;0.85;0.97;1" dur="8s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="scorrevole"><rect x="40" y="206" width="720" height="26"/></clipPath>
  </defs>

  <!-- desktop -->
  <rect width="800" height="300" fill="#008080"/>

  <!-- finestra -->
  <rect x="10" y="10" width="780" height="280" fill="#c0c0c0"/>
  <path d="M10 290V10h780" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M10 290h780V10" fill="none" stroke="#404040" stroke-width="2"/>

  <!-- barra del titolo -->
  <rect x="14" y="14" width="772" height="28" fill="url(#titolo)"/>
  <text x="26" y="34" fill="#fff" font-size="15" font-weight="bold">SMS.EXE - My SMS</text>
  <g>
    <rect x="696" y="18" width="24" height="20" fill="#c0c0c0" stroke="#404040"/><text x="702" y="33" font-size="14" font-weight="bold">_</text>
    <rect x="722" y="18" width="24" height="20" fill="#c0c0c0" stroke="#404040"/><rect x="729" y="23" width="10" height="9" fill="none" stroke="#000" stroke-width="2"/>
    <rect x="752" y="18" width="24" height="20" fill="#c0c0c0" stroke="#404040"/><text x="758" y="33" font-size="14" font-weight="bold">X</text>
  </g>

  <!-- area testo incavata -->
  <rect x="30" y="56" width="740" height="90" fill="#000"/>
  <path d="M30 146V56h740" fill="none" stroke="#404040" stroke-width="2"/>
  <path d="M30 146h740V56" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="40" y="82" fill="#00ff00" font-size="15" font-family="'Courier New', monospace">C:\&gt; privacy.exe --internet=NO --cloud=NO</text>
  <g clip-path="url(#macchina)">
    <text x="40" y="128" fill="#00ff00" font-size="18" font-family="'Courier New', monospace" font-weight="bold">Nessun dato esce dal telefono_</text>
  </g>
  <rect x="293" y="112" width="10" height="18" fill="#00ff00">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- pulsanti -->
  <g font-size="14">
    <rect x="40" y="160" width="130" height="30" fill="#c0c0c0"/><path d="M40 190V160h130" fill="none" stroke="#fff" stroke-width="2"/><path d="M40 190h130V160" fill="none" stroke="#404040" stroke-width="2"/>
    <text x="64" y="180">Installa / Install</text>
    <rect x="186" y="160" width="130" height="30" fill="#c0c0c0"/><path d="M186 190V160h130" fill="none" stroke="#fff" stroke-width="2"/><path d="M186 190h130V160" fill="none" stroke="#404040" stroke-width="2"/>
    <text x="226" y="180">v3.6.7</text>
  </g>

  <!-- messaggio scorrevole -->
  <rect x="30" y="204" width="740" height="30" fill="#fff"/>
  <path d="M30 234V204h740" fill="none" stroke="#404040" stroke-width="2"/>
  <path d="M30 234h740V204" fill="none" stroke="#fff" stroke-width="2"/>
  <g clip-path="url(#scorrevole)">
    <text y="225" font-size="15" font-family="'Courier New', monospace" fill="#000080" font-weight="bold">
      *** SMS * Kotlin * zero librerie * zero internet * zero tracker *** No libraries * No internet * No trackers ***
      <animateTransform attributeName="transform" type="translate" from="800 0" to="-1200 0" dur="18s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- barra di stato -->
  <rect x="30" y="250" width="740" height="24" fill="#c0c0c0"/>
  <path d="M30 274V250h740" fill="none" stroke="#808080"/>
  <text x="38" y="267" font-size="13">Pronto. / Ready.</text>
</svg>
