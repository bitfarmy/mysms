name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepara la chiave di firma (se presente nei secret)
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
        run: |
          if [ -n "$FIRMA_BASE64" ]; then
            echo "$FIRMA_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "FIRMA_FILE=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
            echo "FIRMA_PASSWORD=${{ secrets.FIRMA_PASSWORD }}" >> "$GITHUB_ENV"
            echo "FIRMA_ALIAS=${{ secrets.FIRMA_ALIAS }}" >> "$GITHUB_ENV"
          fi

      - name: Esegui i test
        run: gradle testDebugUnitTest

      - name: Compila l'app SMS
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: i-miei-sms
          path: app/build/outputs/apk/release/app-release.apk

      - name: Pubblica la release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONE="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "mysms-${VERSIONE}.apk"
          gh release create "$GITHUB_REF_NAME" "mysms-${VERSIONE}.apk" \
            --title "I miei SMS $VERSIONE" --notes-file .github/release-notes.md
